<section class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <h1>CondoTicket</h1>
    <p>Entre com sua conta para acessar os chamados.</p>

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      [class.invalid]="submitted && !!fieldErrors.email"
      required
    />
    <small *ngIf="submitted && fieldErrors.email" class="error">{{ fieldErrors.email }}</small>

    <label for="senha">Senha</label>
    <input
      id="senha"
      type="password"
      name="senha"
      [(ngModel)]="senha"
      [class.invalid]="submitted && !!fieldErrors.senha"
      required
    />
    <small *ngIf="submitted && fieldErrors.senha" class="error">{{ fieldErrors.senha }}</small>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <small *ngIf="errorMessage" class="error">{{ errorMessage }}</small>
  </form>
</section>
