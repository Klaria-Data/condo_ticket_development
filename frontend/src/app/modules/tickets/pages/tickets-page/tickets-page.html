<app-header [viewMode]="viewMode" (viewModeChange)="onViewModeChange($event)"></app-header>

<div class="page">
  <main class="content">
     <app-tickets-summary
      *ngIf="viewMode === 'SINDICO'"
      [tickets]="tickets"
    ></app-tickets-summary>
    <app-page-header
      [viewMode]="viewMode"
      [showOnlyMyTickets]="showOnlyMyTickets"
      (newTicket)="onNewTicket()"
      (ownershipFilterToggle)="toggleOwnershipFilter()"
    />

    <app-ticket-filters
      [search]="search"
      [activeFilter]="activeFilter"
      (searchChange)="onSearchChange($event)"
      (activeFilterChange)="onFilterChange($event)"
    />

    <app-ticket-list
      [tickets]="paginatedTickets"
      [viewMode]="viewMode"
      (statusChange)="updateTicketStatus($event)"
    />

    <nav *ngIf="totalPages > 1" class="pagination" aria-label="Paginação de chamados">
      <button type="button" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
        Anterior
      </button>
      <span>Página {{ currentPage }} de {{ totalPages }}</span>
      <button type="button" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">
        Próxima
      </button>
    </nav>
  </main>

  <app-new-ticket-modal
    *ngIf="isNewTicketModalOpen"
    (close)="closeNewTicketModal()"
    (create)="createTicket($event)"
  />
</div>
