<app-header (viewModeChange)="onViewModeChange($event)"></app-header>

<div class="page">
  <main class="content">
    <p *ngIf="errorMessage" class="backend-error">{{ errorMessage }}</p>

    <app-page-header
      [viewMode]="viewMode"
      (newTicket)="onNewTicket()"
    />

    <app-ticket-filters
      [search]="search"
      [activeFilter]="activeFilter"
      (searchChange)="onSearchChange($event)"
      (activeFilterChange)="onFilterChange($event)"
    />

    <app-ticket-list
      [tickets]="filteredTickets"
      [viewMode]="viewMode"
    />
  </main>

  <app-new-ticket-modal
    *ngIf="isNewTicketModalOpen"
    (close)="closeNewTicketModal()"
    (create)="createTicket($event)"
  />
</div>
