<section class="summary-grid">
  <article class="summary-card">
    <div class="summary-content">
      <span class="summary-label">Total de Chamados</span>
      <h3>{{ total }}</h3>
      <p class="summary-trend" [ngClass]="totalTrendClass">{{ totalTrendText }}</p>
    </div>
    <div class="summary-icon total-icon">
      <lucide-icon [img]="FileText" [size]="32" [strokeWidth]="1.6" color="#4f46e5" />
    </div>
  </article>

  <article class="summary-card">
    <div class="summary-content">
      <span class="summary-label">Abertos</span>
      <h3>{{ open }}</h3>
      <p class="summary-trend" [ngClass]="openTrendClass">{{ openTrendText }}</p>
    </div>
    <div class="summary-icon open-icon">
      <lucide-icon [img]="AlertCircle" [size]="32" [strokeWidth]="1.6" color="#dc2626" />
    </div>
  </article>

  <article class="summary-card">
    <div class="summary-content">
      <span class="summary-label">Em Andamento</span>
      <h3>{{ inProgress }}</h3>
      <p class="summary-trend" [ngClass]="inProgressTrendClass">{{ inProgressTrendText }}</p>
    </div>
    <div class="summary-icon progress-icon">
      <lucide-icon [img]="Clock" [size]="32" [strokeWidth]="1.6" color="#d97706" />
    </div>
  </article>

  <article class="summary-card">
    <div class="summary-content">
      <span class="summary-label">Resolvidos</span>
      <h3>{{ resolved }}</h3>
      <p class="summary-trend" [ngClass]="resolvedTrendClass">{{ resolvedTrendText }}</p>
    </div>
    <div class="summary-icon resolved-icon">
      <lucide-icon [img]="CheckCircle2" [size]="32" [strokeWidth]="1.6" color="#059669" />
    </div>
  </article>
</section>
