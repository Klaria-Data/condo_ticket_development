<article class="ticket-card">
  <div class="top-row">
    <div class="avatar" [style.background]="ticket.avatarColor">
      {{ initials }}
    </div>

    <div class="content">
      <h2>{{ ticket.title }}</h2>
      <p class="description">{{ ticket.description }}</p>

      <app-status-badge
        *ngIf="viewMode === 'MORADOR'"
        [status]="ticket.status"
      />

      <div *ngIf="viewMode === 'SINDICO'" class="status-dropdown">

<select
  [ngModel]="ticket.status"
  (ngModelChange)="changeStatus($event)"
  [ngClass]="ticket.status.toLowerCase()"
>

<option value="ABERTO">Aberto</option>
<option value="EM_ANDAMENTO">Em Andamento</option>
<option value="RESOLVIDO">Resolvido</option>

</select>

</div>



      <div class="meta">
        <div class="mini-avatar" [style.background]="ticket.avatarColor">
          {{ initials }}
        </div>

        <span>{{ ticket.residentName }}</span>
        <span class="chip">
          <lucide-icon [img]="Home" [size]="14" [strokeWidth]="1.8" color="#64748b" />
          {{ ticket.apartment }}
        </span>
        <span class="chip">
          <lucide-icon [img]="Clock" [size]="14" [strokeWidth]="1.8" color="#64748b" />
          {{ ticket.createdAt }}
        </span>

        <span *ngIf="viewMode === 'SINDICO' && ticket.updatedAt" class="updated">
          <lucide-icon [img]="CheckCircle2" [size]="14" [strokeWidth]="2" color="#059669" />
          Atualizado {{ ticket.updatedAt }}
        </span>
      </div>

      <button class="comments-toggle-button" (click)="toggleComments()">
        <lucide-icon [img]="showComments ? ChevronDown : ChevronRight" [size]="15" [strokeWidth]="2" color="#fff" />
        {{ showComments ? 'Ocultar Comentários' : 'Ver Comentários' }}
      </button>
    </div>
  </div>

  <!-- Seção de comentários (expandível) -->
  <div *ngIf="showComments" class="comments-section">
    <app-ticket-comments [ticketId]="ticket.id"></app-ticket-comments>
  </div>
</article>
