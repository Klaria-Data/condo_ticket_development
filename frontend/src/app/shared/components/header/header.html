<header class="header">
  <div class="left">
    <div class="brand-icon">
      <lucide-icon [img]="Building2" [size]="22" [strokeWidth]="1.8" color="#4f46e5" />
    </div>
    <div>
      <h1>CondoTicket</h1>
      <p>Gerencie o condominio</p>
    </div>
  </div>

  <div class="right">
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <lucide-icon [img]="Wrench" [size]="15" [strokeWidth]="2" />
        Chamados
      </a>
      <a routerLink="/agendamentos" routerLinkActive="active">
        <lucide-icon [img]="CalendarDays" [size]="15" [strokeWidth]="2" />
        Agendamentos
      </a>
      <a routerLink="/moradores" routerLinkActive="active">
        <lucide-icon [img]="UsersRound" [size]="15" [strokeWidth]="2" />
        Moradores
      </a>
    </nav>

    <div class="switch">
      <span>Visualizar como:</span>
      <div class="buttons">
        <button type="button" [class.active]="viewMode === 'MORADOR'" (click)="setMode('MORADOR')">
          <lucide-icon [img]="UserRound" [size]="15" [strokeWidth]="2" />
          Morador
        </button>
        <button type="button" [class.active]="viewMode === 'SINDICO'" (click)="setMode('SINDICO')">
          <lucide-icon [img]="ShieldCheck" [size]="15" [strokeWidth]="2" />
          Sindico
        </button>
      </div>
    </div>
  </div>
</header>
