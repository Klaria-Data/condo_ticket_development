# API Gateway — CondoTicket
#
# Escuta na porta 8000 e roteia requisições para os microsserviços internos.
# O frontend sempre aponta para http://localhost:8000; o nginx decide quem responde.
#
# IMPORTANTE: A ordem dos blocos location importa.
# O bloco de comentários (/tickets/*/comentarios) DEVE vir antes do bloco de tickets
# porque o nginx usa correspondência por prefixo mais longo para blocos com regex (~).

upstream auth_service {
    server auth:8001;
}

upstream tickets_service {
    server tickets:8002;
}

upstream comments_service {
    server comments:8003;
}

server {
    listen 8000;

    # Cabeçalhos de proxy padrão para todos os upstreams
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Auth Service: /registro e /login ─────────────────────────────────────
    location ~ ^/(registro|login) {
        proxy_pass http://auth_service;
    }

    # ── Comments Service: /tickets/{id}/comentarios e subpaths ───────────────
    # DEVE vir antes do bloco /tickets para capturar o prefixo mais longo.
    location ~ ^/tickets/[0-9]+/comentarios {
        proxy_pass http://comments_service;
    }

    # ── Tickets Service: /tickets e subpaths ─────────────────────────────────
    location /tickets {
        proxy_pass http://tickets_service;
    }

    location ~ ^/(locais-agendaveis|agendamentos) {
        proxy_pass http://tickets_service;
    }
}
