# CondoTicket API Gateway
#
# Porta publica: 8000.
# O frontend chama esta porta e o nginx roteia para os microservicos internos.

upstream auth_service {
    server auth:8001;
}

upstream tickets_service {
    server tickets:8002;
}

upstream comments_service {
    server comments:8003;
}

server {
    listen 8000;
    client_max_body_size 10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth Service: login, registro e convites de moradores.
    location ~ ^/(registro|login) {
        proxy_pass http://auth_service;
    }

    location ~ ^/(moradores/convites|convites) {
        proxy_pass http://auth_service;
    }

    # Comments Service: deve vir antes de /tickets.
    location ~ ^/tickets/[0-9]+/comentarios {
        proxy_pass http://comments_service;
    }

    # Tickets Service: chamados.
    location /tickets {
        proxy_pass http://tickets_service;
    }

    # Tickets Service: agendamentos e locais compartilhados.
    location ~ ^/(locais-agendaveis|agendamentos) {
        proxy_pass http://tickets_service;
    }
}
