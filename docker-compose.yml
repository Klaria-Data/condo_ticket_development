# CondoTicket - Arquitetura de Microservicos
#
# Para subir tudo:
#   docker compose up --build
#
# Servicos:
#   nginx     - API Gateway publico na porta 8000
#   auth      - autenticacao, login e convites de moradores
#   tickets   - chamados e agendamentos de areas compartilhadas
#   comments  - comentarios dos chamados
#   frontend  - SPA Angular na porta 4200
#   mysql     - banco MySQL 8

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - '8000:8000'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - tickets
      - comments
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    expose:
      - '8001'
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:root@mysql:3306/condoticket}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:4200}
      - INVITE_EXPIRE_DAYS=${INVITE_EXPIRE_DAYS:-7}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Sindico Teste}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-sindico@teste.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-senha123456}
      - SEED_ADMIN_UNIDADE=${SEED_ADMIN_UNIDADE:-301}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  tickets:
    build:
      context: .
      dockerfile: services/tickets/Dockerfile
    expose:
      - '8002'
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:root@mysql:3306/condoticket}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    volumes:
      - ticket-uploads:/app/uploads/tickets
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  comments:
    build:
      context: .
      dockerfile: services/comments/Dockerfile
    expose:
      - '8003'
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:root@mysql:3306/condoticket}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '4200:4200'
    depends_on:
      - nginx
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=condoticket
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  ticket-uploads:
