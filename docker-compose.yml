version: '3.9'

# CondoTicket — Arquitetura de Microsserviços
#
# Serviços:
#   nginx     - API Gateway (porta 8000, pública)
#   auth      - Autenticação: /registro e /login (porta 8001, interna)
#   tickets   - Gestão de tickets (porta 8002, interna)
#   comments  - Chat/comentários dos tickets (porta 8003, interna)
#   frontend  - Angular SPA (porta 4200, pública)
#   mysql     - Banco de dados MySQL 8 (porta 3306, local dev)
#
# Para subir tudo: docker compose up --build

services:

  # ── API Gateway ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - '8000:8000'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - tickets
      - comments
    restart: unless-stopped

  # ── Auth Service ──────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    expose:
      - '8001'
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:root@mysql:3306/condoticket}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── Tickets Service ───────────────────────────────────────────────────────
  tickets:
    build:
      context: .
      dockerfile: services/tickets/Dockerfile
    expose:
      - '8002'
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:root@mysql:3306/condoticket}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── Comments Service ──────────────────────────────────────────────────────
  comments:
    build:
      context: .
      dockerfile: services/comments/Dockerfile
    expose:
      - '8003'
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:root@mysql:3306/condoticket}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - '4200:4200'
    depends_on:
      - nginx
    restart: unless-stopped

  # ── MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=condoticket
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
