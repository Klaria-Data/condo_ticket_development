<div class="modal-overlay" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h2>Novo Chamado</h2>
        <p>Descreva o problema encontrado</p>
      </div>

      <button type="button" class="close-btn" (click)="onClose()">×</button>
    </div>

    <div class="modal-body">
      <div class="field full">
        <label for="title">Título do Chamado</label>
        <input
          id="title"
          type="text"
          [(ngModel)]="title"
          placeholder="Ex: Vazamento no banheiro"
        />
      </div>

      <div class="field full">
        <label for="description">Descrição</label>
        <textarea
          id="description"
          [(ngModel)]="description"
          placeholder="Descreva o problema em detalhes"
          rows="6"
        ></textarea>
      </div>

      <div class="row">
        <div class="field half">
          <label for="residentName">Nome do Morador</label>
          <input
            id="residentName"
            type="text"
            [(ngModel)]="residentName"
            placeholder="Ex: João Silva"
          />
        </div>

        <div class="field half">
          <label for="apartment">Unidade</label>
          <input
            id="apartment"
            type="text"
            [(ngModel)]="apartment"
            placeholder="Ex: Apto 101"
          />
        </div>
      </div>

      <div class="field full">
        <label>Foto do Problema (opcional)</label>

        <label class="upload-box" for="fileInput">
          <input
            id="fileInput"
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
          />

          <div class="upload-icon">🖼</div>
          <span class="upload-title">Clique para selecionar uma foto</span>
          <span class="upload-subtitle">
            PNG, JPG ou JPEG até 10 MB
          </span>

          <span *ngIf="selectedFileName" class="file-name">
            {{ selectedFileName }}
          </span>
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="secondary-btn" (click)="onClose()">
        Cancelar
      </button>

      <button
        type="button"
        class="primary-btn"
        (click)="onSubmit()"
        [disabled]="!title || !description || !residentName || !apartment"
      >
        Criar Chamado
      </button>
    </div>
  </div>
</div>
