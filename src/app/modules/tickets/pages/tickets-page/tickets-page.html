<div class="page">
  <main class="content">
    <app-page-header (newTicket)="onNewTicket()" />

    <app-ticket-filters
      [search]="search"
      [activeFilter]="activeFilter"
      (searchChange)="onSearchChange($event)"
      (activeFilterChange)="onFilterChange($event)"
    />

    <app-ticket-list [tickets]="filteredTickets" />
  </main>
</div>
